name: Protected staging configuration and access
run-name: Staging configuration - ${{ inputs.operation }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [health, initial, release, credentials, authorize-live, revoke]
        required: true
      approval:
        description: Exact operation approval from the bootstrap guide
        type: string
      release_descriptor:
        description: For release only, reviewed skillRelease JSON object; no credentials
        type: string
permissions:
  contents: read
concurrency:
  group: isolated-staging-configuration
  cancel-in-progress: false
jobs:
  security-review:
    if: github.ref == 'refs/heads/main' && contains(fromJSON('["initial","credentials","authorize-live","revoke"]'), inputs.operation)
    runs-on: ubuntu-latest
    environment: deployment-security
    steps:
      - run: echo 'Explicit staging credential or security operation approved.'
  configure:
    needs: security-review
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs['security-review'].result == 'success' || (needs['security-review'].result == 'skipped' && contains(fromJSON('["health","release"]'), inputs.operation))) }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Invoke bounded unprivileged Host configuration
        env:
          OPERATION: ${{ inputs.operation }}
          APPROVAL: ${{ inputs.approval }}
          INITIAL_CONFIGURATION: ${{ (inputs.operation == 'initial' || inputs.operation == 'credentials') && secrets.GAMERHQ_STAGING_CONFIGURATION || '' }}
          RELEASE_DESCRIPTOR: ${{ inputs.release_descriptor }}
          GAMERHQ_STAGING_SSH_HOST: ${{ vars.GAMERHQ_STAGING_SSH_HOST }}
          GAMERHQ_STAGING_SSH_PORT: ${{ vars.GAMERHQ_STAGING_SSH_PORT || '22' }}
          GAMERHQ_STAGING_SSH_KEY: ${{ secrets.GAMERHQ_STAGING_SSH_KEY }}
          GAMERHQ_STAGING_SSH_KNOWN_HOSTS: ${{ vars.GAMERHQ_STAGING_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == initial || "$OPERATION" == credentials ]]; then
            export GAMERHQ_STAGING_CONFIGURATION="$INITIAL_CONFIGURATION"
          elif [[ "$OPERATION" == release ]]; then
            export GAMERHQ_STAGING_CONFIGURATION="$RELEASE_DESCRIPTOR"
          fi
          python3 -m tools.staging_ssh_client --phase configure --operation "$OPERATION" --approval "$APPROVAL"
  automatic-update:
    needs: configure
    # Keep the originating main ref. workflow_run would execute on the default
    # develop ref and be denied by the main-only staging environment policy.
    if: github.ref == 'refs/heads/main' && inputs.operation == 'release' && vars.GAMERHQ_STAGING_UPDATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate and apply the selected immutable staging release
        env:
          GAMERHQ_STAGING_SSH_HOST: ${{ vars.GAMERHQ_STAGING_SSH_HOST }}
          GAMERHQ_STAGING_SSH_PORT: ${{ vars.GAMERHQ_STAGING_SSH_PORT || '22' }}
          GAMERHQ_STAGING_SSH_KEY: ${{ secrets.GAMERHQ_STAGING_SSH_KEY }}
          GAMERHQ_STAGING_SSH_KNOWN_HOSTS: ${{ vars.GAMERHQ_STAGING_SSH_KNOWN_HOSTS }}
        run: python3 -m tools.staging_auto_update
