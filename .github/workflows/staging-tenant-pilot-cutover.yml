name: Protected Staging tenant pilot cutover
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/staging-tenant-pilot-cutover.yml']
permissions:
  contents: read
concurrency:
  group: host-staging-automation
  cancel-in-progress: false
jobs:
  registration-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo 'Workflow registration check. No Staging access.'
  cutover:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.GAMERHQ_STAGING_AUTOMATION_ENROLLED == 'true'
    runs-on: ubuntu-latest
    environment: deployment-security
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1c8878e869674f57fd66d3cad61d388aec033c5d
          persist-credentials: false
      - name: Apply or recover the enrolled Staging transaction
        env:
          GAMERHQ_STAGING_SSH_HOST: ${{ vars.GAMERHQ_STAGING_SSH_HOST }}
          GAMERHQ_STAGING_SSH_PORT: ${{ vars.GAMERHQ_STAGING_SSH_PORT }}
          GAMERHQ_STAGING_SSH_KNOWN_HOSTS: ${{ vars.GAMERHQ_STAGING_SSH_KNOWN_HOSTS }}
          GAMERHQ_STAGING_AUTOMATION_SSH_KEY: ${{ secrets.GAMERHQ_STAGING_AUTOMATION_SSH_KEY }}
        run: python3 -m tools.staging_automation_client tenant-pilot-cutover
