name: Installed staging pre-build regression
on:
  pull_request:
    paths: ['tools/staging_prebuild_diagnostics.py', 'tools/staging_buildx_smoke.py', 'tools/upgrade_staging_worker.py', 'tools/staging_worker_revision_smoke.py', 'tools/staging_dispatch.py', 'tools/staging_errors.py', 'tools/staging_inspect.py', 'hosts/gamerhq/skill_staging.py', '.github/workflows/staging-prebuild-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        installed: ['2e6a0ea40c40447fd3bae1a3b14fb845d6675b77', '1c8ec294491f089c85a4f919a8bea5bf74e8f1f8', '8390d4aefdbb48f2ed1f27717320f14401166bec', '2cb9adc79d42b95bf07ebd81600550be358cef11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.installed }}
          path: installed-worker-source
      - name: Provision exact installed worker on disposable runner only
        working-directory: installed-worker-source
        env:
          INSTALLED_COMMIT: ${{ matrix.installed }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server uidmap dbus-user-session acl slirp4netns rootlesskit
          sudo systemctl start ssh
          ssh-keygen -q -t ed25519 -N '' -f /tmp/staging-prebuild-ci-key
          sudo python3 -m tools.prepare_staging_access \
            --commit "$INSTALLED_COMMIT" \
            --public-key-file /tmp/staging-prebuild-ci-key.pub \
            --apply --install-prerequisites --approval 'PREPARE ISOLATED STAGING'
      - name: Exercise installed pre-build boundary without a build or credentials
        env:
          INSTALLED_COMMIT: ${{ matrix.installed }}
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 tools/staging_prebuild_diagnostics.py \
            --expected-worker-commit "$INSTALLED_COMMIT" > /tmp/prebuild-evidence.json
          cat /tmp/prebuild-evidence.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/prebuild-evidence.json'))
          assert p['preBuildChecksPassed'], p
          assert not any(p[k] for k in ('dockerBuildInvoked','gatewayStarted','credentialFilesOpened','productionChanged'))
          PY
      - name: Reproduce read-only Buildx failure and verify isolated writable state
        run: sudo env GITHUB_ACTIONS=true python3 tools/staging_buildx_smoke.py
      - name: Verify reviewed source revision and real restricted SSH error reporting
        if: hashFiles('tools/upgrade_staging_worker.py') != ''
        env:
          REVIEWED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sudo env GITHUB_ACTIONS=true python3 -m tools.staging_worker_revision_smoke --commit "$REVIEWED_COMMIT"
