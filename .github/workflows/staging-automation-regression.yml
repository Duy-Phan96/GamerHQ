name: Scoped staging automation regression
on:
  pull_request:
    paths: ['tools/staging_automation/**', 'tools/extend_staging_host_promotion.py', 'hosts/gamerhq/skill_update_controller.py', 'tests/test_staging_host_promotion.py', 'tools/enroll_staging_automation.py', 'tools/staging_automation_smoke.py', 'tools/staging_ssh_router.py', 'tools/repair_staging_ssh_routing.py', 'tools/repair_staging_automation_access.py', 'tests/test_staging_ssh_router.py', '.github/workflows/staging-automation*.yml', '.github/workflows/staging-host-promotion.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 92db47042d58055cb0debdfd83f11f8508e19809
          path: installed-worker-source
      - name: Verify the exact candidate archive independently on Linux
        shell: bash
        run: |
          set -euo pipefail
          candidate=de6447a25d36dc002070b2f0e94b4df0dcc9ef0b
          git fetch origin "$candidate"
          archive="$RUNNER_TEMP/structure-phases.tar"
          git archive --format=tar --output="$archive" "$candidate"
          echo "260c8f886d7485bd6fafa7701ac9021d07d4cf1d8cff81c8387034d00731faf6  $archive" | sha256sum --check --strict
          sha256sum "$archive"
      - name: Provision the current installed worker on this disposable runner
        working-directory: installed-worker-source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server uidmap dbus-user-session acl slirp4netns rootlesskit
          sudo systemctl start ssh
          ssh-keygen -q -t ed25519 -N '' -f /tmp/staging-legacy-ci-key
          sudo python3 -m tools.prepare_staging_access --commit 92db47042d58055cb0debdfd83f11f8508e19809 --public-key-file /tmp/staging-legacy-ci-key.pub --apply --install-prerequisites --approval 'PREPARE ISOLATED STAGING'
      - name: Verify enrollment, unchanged legacy state and actual forced-command SSH
        env:
          REVIEWED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sudo env GITHUB_ACTIONS=true python3 -m tools.staging_automation_smoke --commit "$REVIEWED_COMMIT"
      - name: Build the exact baseline and rehearse the approved Host overlay offline
        shell: bash
        run: |
          set -euo pipefail
          baseline=6734b756685d90de8e56ddc299560ec13625300e
          git fetch origin "$baseline"
          mkdir /tmp/gamerhq-host-baseline
          git archive "$baseline" | tar -x -C /tmp/gamerhq-host-baseline
          docker build --build-arg VCS_REF="$baseline" --iidfile /tmp/gamerhq-host-baseline-image /tmp/gamerhq-host-baseline
          sudo /opt/gamerhq-staging/deployment-worker/.venv/bin/python -m tools.staging_host_promotion_smoke --base-image "$(cat /tmp/gamerhq-host-baseline-image)"

      - name: Publish checksum of the exact reviewed enrollment installer
        env:
          REVIEWED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git show "$REVIEWED_COMMIT:tools/extend_staging_host_promotion.py" | sha256sum
