name: Scoped staging automation regression
on:
  pull_request:
    paths: ['tools/staging_automation/**', 'tools/extend_staging_host_promotion.py', 'hosts/gamerhq/skill_update_controller.py', 'tests/test_staging_host_promotion.py', 'tools/enroll_staging_automation.py', 'tools/staging_automation_smoke.py', 'tools/staging_ssh_router.py', 'tools/repair_staging_ssh_routing.py', 'tools/repair_staging_automation_access.py', 'tests/test_staging_ssh_router.py', '.github/workflows/staging-automation*.yml', '.github/workflows/staging-host-promotion.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rc4-overlay-qualification:
    # Public source only. No protected environment, VPS, secrets or Gateway.
    if: github.head_ref == 'chore/rc4-active-pilot-upgrade-134'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Qualify the frozen RC4 source against the attested active Staging Host
        shell: bash
        run: |
          set -euo pipefail
          baseline=1899c6f8cc498fefa0510d0e3f70453f6f1aa082
          candidate=bc090665e6ffd24f16cc26b5f67f666c8e3f98a5
          for ref in "$baseline" "$candidate"; do
            git cat-file -e "$ref^{commit}"
            test "$(git rev-parse "$ref")" = "$ref"
          done
          test "$(git show "$candidate:VERSION")" = 1.0.0-beta.2-rc4
          # Exact same source trees for schema, startup, SDK and packages.
          for path in requirements.txt requirements.lock requirements-skills.lock pyproject.toml Dockerfile database skill_runtime skills hosts data/games_seed.json data/game_catalog_expansion.json bot.py config.py; do
            test "$(git rev-parse "$baseline:$path")" = "$(git rev-parse "$candidate:$path")"
          done
          # Overlay COPY does not remove files; reject any deleted path.
          test -z "$(git diff --no-renames --diff-filter=D --name-only "$baseline" "$candidate")"
          archive="$RUNNER_TEMP/gamerhq-rc4-source.tar"
          git archive --format=tar --output="$archive" "$candidate"
          test "$(stat -c %s "$archive")" -le 33554432
          digest="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          printf 'baselineCommit=%s\ncandidateCommit=%s\narchiveSha256=%s\nsourceCompatibility=PASS\n' "$baseline" "$candidate" "$digest"
          {
            echo '### RC4 source overlay qualification'
            printf '\nBaseline: `%s`\n\nCandidate: `%s`\n\nArchive SHA256: `%s`\n\nSource compatibility: PASS. No live deployment or database rehearsal performed.\n' "$baseline" "$candidate" "$digest"
          } >> "$GITHUB_STEP_SUMMARY"
  generation-enrollment:
    # Entire installer runs as root against /tmp fixtures, never the VPS.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: |
          python -m venv "$RUNNER_TEMP/enrollment-tests"
          "$RUNNER_TEMP/enrollment-tests/bin/python" -m pip install -r requirements.lock -r requirements-dev.txt
          "$RUNNER_TEMP/enrollment-tests/bin/python" -m pip install --no-deps -r requirements-skills.lock
      - name: Focused active-pilot controller and rollback regressions
        run: |
          "$RUNNER_TEMP/enrollment-tests/bin/python" -m pytest -q tests/test_staging_pilot_generation.py tests/test_staging_pilot_activation.py
      - name: Publish exact reviewed RC4 enrollment installer checksum
        env:
          REVIEWED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          printf 'controllerCommit=%s\n' "$REVIEWED_COMMIT"
          printf 'installerSha256=%s\n' "$(git show "$REVIEWED_COMMIT:tools/enroll_staging_pilot_generation.py" | sha256sum | cut -d ' ' -f 1)"
      - name: Rehearse exact enrollment, power loss, retry and immutable source rejection
        run: |
          set -euo pipefail
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin gamerhq-staging-bridge
          sudo env GAMERHQ_PILOT_ENROLLMENT_E2E=true "$RUNNER_TEMP/enrollment-tests/bin/python" -m pytest -q tests/test_staging_pilot_enrollment_e2e.py
  scoped-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          # This enrollment permits only the historical managed-message pin change.
          ref: ff519f698f973b056eeae0b9d026a71dbf8fbaae
          fetch-depth: 0
          path: reviewed-controller-enrollment
      - uses: actions/checkout@v4
        with:
          ref: 92db47042d58055cb0debdfd83f11f8508e19809
          path: installed-worker-source
      - name: Verify the exact candidate archive independently on Linux
        shell: bash
        run: |
          set -euo pipefail
          candidate=6734b756685d90de8e56ddc299560ec13625300e
          git fetch origin "$candidate"
          archive="$RUNNER_TEMP/managed-message-preview.tar"
          git archive --format=tar --output="$archive" "$candidate"
          echo "5f22a55a8d13d8a48fcb040d308bba240ba8d805939d9b51017a5f26efb368eb  $archive" | sha256sum --check --strict
          sha256sum "$archive"
      - name: Provision the current installed worker on this disposable runner
        working-directory: installed-worker-source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server uidmap dbus-user-session acl slirp4netns rootlesskit
          sudo systemctl start ssh
          ssh-keygen -q -t ed25519 -N '' -f /tmp/staging-legacy-ci-key
          sudo python3 -m tools.prepare_staging_access --commit 92db47042d58055cb0debdfd83f11f8508e19809 --public-key-file /tmp/staging-legacy-ci-key.pub --apply --install-prerequisites --approval 'PREPARE ISOLATED STAGING'
      - name: Verify enrollment, unchanged legacy state and actual forced-command SSH
        working-directory: reviewed-controller-enrollment
        shell: bash
        run: |
          set -euo pipefail
          # Historical installers each open a clean, shallow Git repository.
          # Serve their immutable pins from the already fetched full checkout.
          git cat-file -e 'a1b50573850921e478a2f838e72868853bde6dd7:tools/enroll_staging_automation.py'
          git cat-file -e '92db47042d58055cb0debdfd83f11f8508e19809:tools/prepare_staging_access.py'
          mirror="url.file://$PWD/.git.insteadOf"
          origin=https://github.com/Duy-Phan96/GamerHQ.git
          sudo git config --system --add safe.directory "$PWD"
          sudo git config --system --add "$mirror" "$origin"
          trap 'sudo git config --system --fixed-value --unset-all "$mirror" "$origin"; sudo git config --system --fixed-value --unset-all safe.directory "$PWD"' EXIT
          sudo env GITHUB_ACTIONS=true python3 -m tools.staging_automation_smoke --commit ff519f698f973b056eeae0b9d026a71dbf8fbaae
      - name: Build the exact baseline and rehearse the approved Host overlay offline
        shell: bash
        run: |
          set -euo pipefail
          baseline=89709625d9ea0c74c2b731436d1d13c9dcb453c4
          git fetch origin "$baseline"
          mkdir /tmp/gamerhq-host-baseline
          git archive "$baseline" | tar -x -C /tmp/gamerhq-host-baseline
          docker build --build-arg VCS_REF="$baseline" --iidfile /tmp/gamerhq-host-baseline-image /tmp/gamerhq-host-baseline
          docker build --build-arg VCS_REF="$(git rev-parse HEAD)" --iidfile /tmp/gamerhq-recovery-image .
          sudo /opt/gamerhq-staging/deployment-worker/.venv/bin/python -m tools.staging_host_promotion_smoke --base-image "$(cat /tmp/gamerhq-host-baseline-image)" --recovery-image "$(cat /tmp/gamerhq-recovery-image)"

      - name: Publish checksum of the exact reviewed enrollment installer
        env:
          REVIEWED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git show "$REVIEWED_COMMIT:tools/extend_staging_host_promotion.py" | sha256sum
      - name: Publish exact proposed multi-guild Host archive checksum
        if: github.head_ref == 'feat/guild-pilot-admission'
        env:
          CANDIDATE: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          printf 'Candidate %s\n' "$CANDIDATE"
          git archive --format=tar "$CANDIDATE" | sha256sum
