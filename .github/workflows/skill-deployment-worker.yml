name: Approved Host Skill worker
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      operation:
        description: auto is staging-only; production requires explicit security review
        type: choice
        options: [auto, stage, apply, history]
        required: true
      release:
        description: Reviewed release filename in protected artifact directory
        type: string
      wheel:
        description: Reviewed wheel filename in protected artifact directory
        type: string
      current_version:
        type: string
      deployment_id:
        description: READY deployment ID; choosing apply explicitly approves this ID
        type: string
      skill_id:
        type: string
        default: event-manager
permissions:
  contents: read
concurrency:
  group: host-skill-deployment
  cancel-in-progress: false
jobs:
  production-review:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && inputs.operation != 'auto' && vars.GAMERHQ_DEPLOYMENT_WORKER_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: deployment-security
    steps:
      - run: echo 'Explicit production operation approved.'
  staging:
    if: github.ref == 'refs/heads/main' && vars.GAMERHQ_STAGING_UPDATES_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Invoke restricted staging update lifecycle
        env:
          OPERATION: ${{ inputs.operation }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          GAMERHQ_STAGING_SSH_HOST: ${{ vars.GAMERHQ_STAGING_SSH_HOST }}
          GAMERHQ_STAGING_SSH_PORT: ${{ vars.GAMERHQ_STAGING_SSH_PORT || '22' }}
          GAMERHQ_STAGING_SSH_KEY: ${{ secrets.GAMERHQ_STAGING_SSH_KEY }}
          GAMERHQ_STAGING_SSH_KNOWN_HOSTS: ${{ vars.GAMERHQ_STAGING_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == auto ]]; then
            python3 -m tools.staging_auto_update
            exit 0
          fi
          approval=''
          if [[ "$OPERATION" == apply ]]; then approval="APPROVE $DEPLOYMENT_ID"; fi
          python3 -m tools.staging_ssh_client --phase update --operation "$OPERATION" \
            --deployment-id "$DEPLOYMENT_ID" --approval "$approval"
  worker:
    needs: production-review
    if: inputs.environment == 'production' && inputs.operation != 'auto' && vars.GAMERHQ_DEPLOYMENT_WORKER_ENABLED == 'true' && github.ref == 'refs/heads/main' && needs['production-review'].result == 'success'
    runs-on: [self-hosted, linux, gamerhq-deployment]
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      - name: Invoke installed reviewed worker
        working-directory: ${{ inputs.environment == 'staging' && '/opt/gamerhq-staging/deployment-worker' || '/opt/gamerhq/deployment-worker' }}
        env:
          TARGET: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          RELEASE: ${{ inputs.release }}
          WHEEL: ${{ inputs.wheel }}
          CURRENT_VERSION: ${{ inputs.current_version }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          SKILL_ID: ${{ inputs.skill_id }}
          GAMERHQ_WEB_API_SECRET: ${{ secrets.GAMERHQ_WEB_API_SECRET }}
          GAMERHQ_STAGING_WEB_API_SECRET: ${{ secrets.GAMERHQ_STAGING_WEB_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          worker=/opt/gamerhq/deployment-worker/.venv/bin/python
          profile="/etc/gamerhq/deployments/$TARGET.json"
          if [[ "$TARGET" == staging ]]; then
            worker=/opt/gamerhq-staging/deployment-worker/.venv/bin/python
            profile=/etc/gamerhq/staging/profile.json
          fi
          case "$OPERATION" in
            stage) "$worker" -m tools.skill_deployment_worker --profile "$profile" stage --release "$RELEASE" --wheel "$WHEEL" --current-version "$CURRENT_VERSION" --manual-review ;;
            apply) export GAMERHQ_PRODUCTION_APPROVAL="$DEPLOYMENT_ID"
              "$worker" -m tools.skill_deployment_worker --profile "$profile" apply --id "$DEPLOYMENT_ID" --approval "APPROVE $DEPLOYMENT_ID" ;;
            history) "$worker" -m tools.skill_deployment_worker --profile "$profile" history --skill-id "$SKILL_ID" ;;
            *) exit 2 ;;
          esac
