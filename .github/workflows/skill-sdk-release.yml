name: Publish reviewed Skill SDK candidate
on:
  push:
    tags: ['skill-sdk-v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Match independent SDK version and reviewed tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,tomllib; assert os.environ['RELEASE_TAG'] == 'skill-sdk-v' + tomllib.load(open('pyproject.toml','rb'))['project']['version']"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m tools.repository_audit --history
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: skill-sdk-${{ matrix.python }}
          path: dist/*.whl
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skill-sdk-3.12
          path: dist
      - name: Publish independent checksum-verified SDK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.whl > SHA256SUMS
          gh release create "$RELEASE_TAG" --prerelease --verify-tag --title "Skill SDK $RELEASE_TAG candidate" \
            --notes 'Independent SDK candidate. No Host deployment or Event Manager cutover is performed.' ./*.whl SHA256SUMS
