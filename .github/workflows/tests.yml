name: Offline tests
on:
  # Feature branches are checked through their PR, avoiding duplicate push/PR runs.
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  staging-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - name: Rehearse Web switching and rollback on disposable Docker
        env:
          GAMERHQ_WEB_CONTROLLER_DOCKER_CI: 'true'
        run: python -m pytest -q tests/test_staging_web.py tests/test_staging_automation_policy.py
      - name: Validate the TLS edge configuration
        run: |
          docker run --rm --network none \
            --env GAMERHQ_WEB_STAGING_HOSTNAME=staging.synthetic.net \
            --volume "$PWD/deploy/staging/web.Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
  staging-rhel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual AlmaLinux 9 Python and D-Bus capabilities
        shell: bash
        run: |
          set -euo pipefail
          docker pull almalinux:9
          docker image inspect almalinux:9 --format '{{json .RepoDigests}}'
          docker run --rm --network bridge --volume "$PWD:/source:ro" --workdir /source almalinux:9 bash -euc '
            dnf install -y python3 python3.12 python3.12-pip dbus-broker dbus-daemon
            python3 -m tools.staging_rhel_smoke
          '
  staging-access:
    # This provisions only the disposable hosted runner, never the GamerHQ VPS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test owner preparation and restricted SSH on disposable runner
        env:
          REVIEWED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server uidmap dbus-user-session acl slirp4netns rootlesskit
          sudo systemctl start ssh
          sudo mkdir -p /opt/gamerhq/data
          printf 'synthetic production sentinel\n' | sudo tee /opt/gamerhq/data/production-fixture >/dev/null
          sudo chmod 755 /opt/gamerhq /opt/gamerhq/data
          sudo chmod 644 /opt/gamerhq/data/production-fixture
          docker run -d --name gamerhq-production-fixture alpine:3.21 sleep 1200
          docker inspect --format '{{.Id}}' gamerhq-production-fixture > /tmp/production-fixture-id
          ssh-keygen -q -t ed25519 -N '' -f /tmp/staging-ci-key
          commit="$REVIEWED_COMMIT"
          sudo python3 -m tools.prepare_staging_access --commit "$commit" --public-key-file /tmp/staging-ci-key.pub
          git fetch origin "$commit"
          python3 -m tools.bootstrap_command --commit "$commit" --public-key-file /tmp/staging-ci-key.pub --output /tmp/verified-staging-bootstrap.sh
          sudo bash /tmp/verified-staging-bootstrap.sh
          sudo bash /tmp/verified-staging-bootstrap.sh
          sudo env GITHUB_ACTIONS=true python3 -m tools.staging_access_smoke --key /tmp/staging-ci-key
      - name: Inspect disposable rootless fixture failure without credentials
        if: failure()
        shell: bash
        run: |
          if id gamerhq-staging-bridge >/dev/null 2>&1; then
            uid=$(id -u gamerhq-staging-bridge)
            sudo journalctl --no-pager -u "user@$uid.service" -n 60
            sudo systemctl show "user@$uid.service" -p User -p ProtectSystem -p ReadWritePaths -p InaccessiblePaths -p MainPID
            manager=$(sudo systemctl show "user@$uid.service" -p MainPID --value)
            if [[ "$manager" != 0 ]]; then
              sudo nsenter -t "$manager" -m -- stat -c '%u:%g %a %n' "/run/user/$uid"
            fi
            sudo runuser -u gamerhq-staging-bridge -- env XDG_RUNTIME_DIR="/run/user/$uid" \
              DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
              journalctl --user --no-pager -u docker.service -n 100
          fi
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pip install --no-deps -r requirements-skills.lock
      - run: python -m pip check
      - name: Compile portable platform packages
        run: python -m compileall -q skill_runtime hosts/gamerhq skills cogs
      - name: Build Skill SDK wheel
        if: matrix.python == '3.12'
        run: python -m pip wheel . --no-deps --wheel-dir /tmp/gamerhq-sdk-dist
      - name: Run release metadata preflight
        if: matrix.python == '3.12'
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          base="${GITHUB_BASE_REF:-}"
          if [[ "$base" == "main" || ( -z "$base" && "$GITHUB_REF_NAME" == "main" ) ]]; then
            channel="main"
          elif [[ "$branch" == release/* ]]; then
            channel="candidate"
          else
            channel="develop"
          fi
          python -m tools.release_preflight --expect-channel "$channel"
      - run: python -m pytest
      - run: python -m tools.repository_audit --history
      - run: bash -n scripts/update.sh scripts/backup.sh
        if: always()
      - name: Validate Compose without credentials
        if: always()
        run: |
          touch ../.env
          docker compose config --quiet
      - name: Build production image (no bot login)
        if: always() && matrix.python == '3.12'
        run: docker compose build
      - name: Validate isolated staging Compose without credentials
        if: always() && matrix.python == '3.12'
        env:
          GAMERHQ_STAGING_IMAGE: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: docker compose --file deploy/staging/compose.json --profile live-acceptance config --quiet
      - name: Verify isolated Host-owned Skill staging with public fixture
        if: success() && matrix.python == '3.12'
        shell: bash
        run: |
          umask 077
          image=$(docker image inspect gamerhq-bot:local --format '{{.Id}}')
          python -m tools.skill_stage_smoke --base-image "$image" --sdk-wheel /tmp/gamerhq-sdk-dist/gamerhq_skill_sdk-0.3.0-py3-none-any.whl
