name: Offline tests
on:
  # Feature branches are checked through their PR, avoiding duplicate push/PR runs.
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate source before isolated review
        if: matrix.python == '3.12'
        run: |
          python -m tools.repository_audit --history
          git diff --check HEAD^ HEAD
          git archive --format=tar --output=/tmp/gamerhq-source.tar HEAD
          python -m pip download --no-deps --dest /tmp/gamerhq-deps discord.py==2.7.1 python-dotenv==1.2.3 pytest==9.1.1 tzdata==2026.3 idna==3.19
          tar -cf /tmp/gamerhq-deps.tar -C /tmp/gamerhq-deps .
      - name: Short-lived source-only review artifact
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: gamerhq-review-source
          path: |
            /tmp/gamerhq-source.tar
            /tmp/gamerhq-deps.tar
          retention-days: 1
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest
      - run: python -m tools.repository_audit --history
      - run: bash -n scripts/update.sh scripts/backup.sh
      - name: Validate Compose without credentials
        run: |
          touch ../.env
          docker compose config --quiet
      - name: Build production image (no bot login)
        if: matrix.python == '3.12'
        run: docker compose build
