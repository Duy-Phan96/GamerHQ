name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest
      - run: python -m tools.repository_audit --history
      - run: bash -n scripts/update.sh scripts/backup.sh
      - name: Validate Compose without credentials
        run: |
          touch ../.env
          docker compose config --quiet
      - name: Build production image (no bot login)
        if: matrix.python == '3.12'
        run: docker compose build
