name: Offline tests
on:
  # Feature branches are checked through their PR, avoiding duplicate push/PR runs.
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pip check
      - name: Compile portable platform packages
        run: python -m compileall -q skill_runtime hosts/gamerhq skills
      - name: Build Skill SDK wheel
        if: matrix.python == '3.12'
        run: python -m pip wheel . --no-deps --wheel-dir /tmp/gamerhq-sdk-dist
      - name: Run release metadata preflight
        if: matrix.python == '3.12'
        run: python -m tools.release_preflight
      - run: python -m pytest
      - run: python -m tools.repository_audit --history
      - run: bash -n scripts/update.sh scripts/backup.sh
        if: always()
      - name: Validate Compose without credentials
        if: always()
        run: |
          touch ../.env
          docker compose config --quiet
      - name: Build production image (no bot login)
        if: always() && matrix.python == '3.12'
        run: docker compose build
