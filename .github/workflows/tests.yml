name: Offline tests
on:
  # Feature branches are checked through their PR, avoiding duplicate push/PR runs.
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  staging-access:
    # This provisions only the disposable hosted runner, never the GamerHQ VPS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test owner preparation and restricted SSH on disposable runner
        env:
          REVIEWED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          ssh-keygen -q -t ed25519 -N '' -f /tmp/staging-ci-key
          commit="$REVIEWED_COMMIT"
          sudo python3 -m tools.prepare_staging_access --commit "$commit" --public-key-file /tmp/staging-ci-key.pub
          sudo python3 -m tools.prepare_staging_access --commit "$commit" --public-key-file /tmp/staging-ci-key.pub \
            --apply --approval 'PREPARE ISOLATED STAGING'
          sudo env GITHUB_ACTIONS=true python3 -m tools.staging_access_smoke --key /tmp/staging-ci-key
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pip install --no-deps -r requirements-skills.lock
      - run: python -m pip check
      - name: Compile portable platform packages
        run: python -m compileall -q skill_runtime hosts/gamerhq skills cogs
      - name: Build Skill SDK wheel
        if: matrix.python == '3.12'
        run: python -m pip wheel . --no-deps --wheel-dir /tmp/gamerhq-sdk-dist
      - name: Run release metadata preflight
        if: matrix.python == '3.12'
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          base="${GITHUB_BASE_REF:-}"
          if [[ "$base" == "main" || ( -z "$base" && "$GITHUB_REF_NAME" == "main" ) ]]; then
            channel="main"
          elif [[ "$branch" == release/* ]]; then
            channel="candidate"
          else
            channel="develop"
          fi
          python -m tools.release_preflight --expect-channel "$channel"
      - run: python -m pytest
      - run: python -m tools.repository_audit --history
      - run: bash -n scripts/update.sh scripts/backup.sh
        if: always()
      - name: Validate Compose without credentials
        if: always()
        run: |
          touch ../.env
          docker compose config --quiet
      - name: Build production image (no bot login)
        if: always() && matrix.python == '3.12'
        run: docker compose build
      - name: Validate isolated staging Compose without credentials
        if: always() && matrix.python == '3.12'
        env:
          GAMERHQ_STAGING_IMAGE: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: docker compose --file deploy/staging/compose.json --profile live-acceptance config --quiet
      - name: Verify isolated Host-owned Skill staging with public fixture
        if: success() && matrix.python == '3.12'
        shell: bash
        run: |
          image=$(docker image inspect gamerhq-bot:local --format '{{.Id}}')
          python -m tools.skill_stage_smoke --base-image "$image" --sdk-wheel /tmp/gamerhq-sdk-dist/gamerhq_skill_sdk-0.3.0-py3-none-any.whl
