name: Isolated Skill staging preparation
run-name: Staging preparation - ${{ inputs.operation }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [prepare-offline, diagnose, inspect, initialize, build-base, fetch, verify-offline, verify, build, bootstrap, install]
        required: true
      approval:
        description: Offline bundle requires PREPARE ISOLATED STAGING OFFLINE; bootstrap is a separate Gateway approval
        type: string
permissions:
  contents: read
concurrency:
  group: isolated-skill-staging
  cancel-in-progress: false
jobs:
  gateway-review:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'bootstrap'
    runs-on: ubuntu-latest
    environment: deployment-security
    steps:
      - run: echo 'Explicit first staging Gateway activation approved.'
  prepare:
    needs: gateway-review
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.GAMERHQ_STAGING_PREPARATION_ENABLED == 'true' && (needs['gateway-review'].result == 'success' || (needs['gateway-review'].result == 'skipped' && contains(fromJSON('["prepare-offline","diagnose","inspect","initialize","build-base","fetch","verify-offline","verify","build","install"]'), inputs.operation))) }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Invoke restricted installed staging tool
        env:
          OPERATION: ${{ inputs.operation }}
          APPROVAL: ${{ inputs.approval }}
          GAMERHQ_STAGING_SSH_HOST: ${{ vars.GAMERHQ_STAGING_SSH_HOST }}
          GAMERHQ_STAGING_SSH_PORT: ${{ vars.GAMERHQ_STAGING_SSH_PORT || '22' }}
          GAMERHQ_STAGING_SSH_KEY: ${{ secrets.GAMERHQ_STAGING_SSH_KEY }}
          GAMERHQ_STAGING_SSH_KNOWN_HOSTS: ${{ vars.GAMERHQ_STAGING_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          invoke_prepare() {
            python3 -m tools.staging_ssh_client --phase prepare --operation "$1" --approval "$2"
          }
          if [[ "$OPERATION" == diagnose ]]; then
            python3 -m tools.staging_ssh_client --phase configure --operation health
            invoke_prepare inspect ''
            invoke_prepare build-base 'BUILD ISOLATED STAGING BASE'
          elif [[ "$OPERATION" == prepare-offline ]]; then
            [[ "$APPROVAL" == 'PREPARE ISOLATED STAGING OFFLINE' ]] || {
              echo 'The offline bundle requires its exact operation approval.' >&2
              exit 1
            }
            # Only existing bounded operations; no live authorization or Gateway.
            # If interrupted after initialization, resume at the failed operation
            # using its existing individual choice; never overwrite a database.
            invoke_prepare build-base 'BUILD ISOLATED STAGING BASE'
            invoke_prepare initialize 'INITIALIZE ISOLATED STAGING'
            invoke_prepare fetch ''
            invoke_prepare verify-offline ''
            invoke_prepare build ''
          else
            invoke_prepare "$OPERATION" "$APPROVAL"
          fi
