name: Isolated Skill staging preparation
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, initialize, build-base, fetch, verify-offline, verify, build, bootstrap, install]
        required: true
      approval:
        description: Explicit operation approval; bootstrap starts only the dedicated staging Gateway
        type: string
permissions:
  contents: read
concurrency:
  group: isolated-skill-staging
  cancel-in-progress: false
jobs:
  prepare:
    if: vars.GAMERHQ_STAGING_PREPARATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Invoke restricted installed staging tool
        env:
          OPERATION: ${{ inputs.operation }}
          APPROVAL: ${{ inputs.approval }}
          GAMERHQ_STAGING_SSH_HOST: ${{ vars.GAMERHQ_STAGING_SSH_HOST }}
          GAMERHQ_STAGING_SSH_PORT: ${{ vars.GAMERHQ_STAGING_SSH_PORT || '22' }}
          GAMERHQ_STAGING_SSH_KEY: ${{ secrets.GAMERHQ_STAGING_SSH_KEY }}
          GAMERHQ_STAGING_SSH_KNOWN_HOSTS: ${{ vars.GAMERHQ_STAGING_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.staging_ssh_client --phase prepare --operation "$OPERATION" --approval "$APPROVAL"
