name: Reviewed staging Host promotion
run-name: Staging Host - Bulk Structure Setup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-staging-automation
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main' && vars.GAMERHQ_STAGING_AUTOMATION_ENROLLED == 'true'
    runs-on: ubuntu-latest
    environment: deployment-security
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Promote only the owner-pinned staging Host source
        env:
          GAMERHQ_STAGING_SSH_HOST: ${{ vars.GAMERHQ_STAGING_SSH_HOST }}
          GAMERHQ_STAGING_SSH_PORT: ${{ vars.GAMERHQ_STAGING_SSH_PORT }}
          GAMERHQ_STAGING_SSH_KNOWN_HOSTS: ${{ vars.GAMERHQ_STAGING_SSH_KNOWN_HOSTS }}
          GAMERHQ_STAGING_AUTOMATION_SSH_KEY: ${{ secrets.GAMERHQ_STAGING_AUTOMATION_SSH_KEY }}
          EXPECTED_STAGING_HOST_COMMIT: c4985b0df53fffad7b83790b257368ac243c013a
        run: |
          set -euo pipefail
          python3 -m tools.staging_automation_client status | python3 -c 'import json, os, sys; s=json.load(sys.stdin); sys.exit(0 if s.get("hostPromotionCommit") == os.environ["EXPECTED_STAGING_HOST_COMMIT"] and not s.get("recoveryRequired") else "Reviewed staging Host pin is unavailable.")'
          python3 -m tools.staging_automation_client host-promote
