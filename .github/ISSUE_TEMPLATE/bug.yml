name: Bug
description: Report incorrect existing behavior with reproducible evidence.
title: "fix: "
labels:
  - bug
body:
  - type: textarea
    id: current
    attributes:
      label: Current Behavior
      description: What happens now?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest safe reproduction steps. Do not include secrets/private user data.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Branch/release, local/CI/dev server, Python/browser/platform details where relevant.
  - type: textarea
    id: evidence
    attributes:
      label: Logs / Evidence
      description: Redacted error/log/test information only. Never paste tokens, private ticket text or production secrets.
  - type: textarea
    id: root
    attributes:
      label: Root Cause
      description: Fill during investigation when known.
  - type: textarea
    id: regression
    attributes:
      label: Regression Test
      description: How should this bug be prevented from returning?
  - type: textarea
    id: deployment
    attributes:
      label: Deployment / Migration Impact
      description: Note live acceptance, DB/config/rollback impact when relevant.