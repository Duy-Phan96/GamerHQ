name: Skill CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GAMERHQ_SDK_REF: 6958eaf3057f8a0fe539afa5ccb9c47b47eb0d70

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned GamerHQ Skill SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gamerhq-skill-sdk @ git+https://github.com/Duy-Phan96/GamerHQ.git@${GAMERHQ_SDK_REF}"
      - name: Install Skill package
        run: |
          python -m pip install --no-deps -e .
          python -m pip install pytest==9.1.1
      - name: Check dependencies
        run: python -m pip check
      - name: Run offline tests
        run: python -m pytest
